<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطب الجمعة في سوريا</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.8rem;
            margin: 20px 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        .city-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .city-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
        }

        .city-card:hover {
            transform: translateY(-5px);
        }

        .city-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .city-card h3 {
            padding: 15px;
            text-align: center;
            background-color: #3498db;
            color: white;
        }

        .sermons-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .sermon-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .sermon-card:hover {
            transform: translateY(-5px);
        }

        .sermon-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .sermon-info {
            padding: 15px;
        }

        .sermon-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .sermon-meta {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .audio-player {
            width: 100%;
            margin-top: 10px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .download-btn:hover {
            background-color: #219653;
        }

        .filter-section {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        select, button {
            padding: 8px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 16px;
            background-color: white;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .back-link {
            position: absolute;
            right: 20px;
            top: 20px;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .city-cards, .sermons-container {
                grid-template-columns: 1fr;
            }
            
            .filter-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>خطب الجمعة في سوريا</h1>
            <p>مجموعة من خطب الجمعة من مختلف جوامع سوريا</p>
            <p style="color: #27ae60;">سيتم اضافة  المزيد قريبا...</p>
        </header>
        
        <nav class="cities-nav">
            <h2>اختر المدينة</h2>
            <div class="city-cards">
                <a href="index1.html" class="city-card">
                    <img style="object-fit: contain;"  src="photo_2025-07-11_09-44-19.jpg" alt="مارع">
                    <h3>مارع</h3>
                </a>
                <a href="aleppo.html" class="city-card">
                    <img src="aleppo.jpg" alt="اعزاز">
                    <h3>اعزاز</h3>
                </a>
                <a href="homs.html" class="city-card">
                    <img src="homs.jpg" alt="جبرين">
                    <h3>جبرين</h3>
                </a>
                <a href="hama.html" class="city-card">
                    <img src="hama.jpg" alt="تلالين">
                    <h3>تلالين</h3>
                
            </div>
        </nav>
        
        <section class="latest-sermons">
            <h2>أحدث الخطب</h2>
            <div class="sermons-container" id="latest-sermons">
                <!-- سيتم ملؤه بالجافا سكريبت -->
            </div>
        </section>
    </div>

    <script>
        // بيانات الخطب
        const sermons = [
            {
                id: 1,
                title: "الموت وانتهاء الاجل",
                city: "مارع",
                mosque: "جامع سلمان الفارسي",
                date: "2025-7-11",
                image: "1.png",
                audio: "صوت ٠٠١.mov",
                speaker: "الشيخ فجر فروح"
            },
            {
                id: 2,
                title: "اداب المسلمين في الفتوحات",
                mosque: "جامع سلمان الفارسي ",
                date: "2025-7-18",
                image: "photo_2025-07-18_14-36-08.jpg",
                audio: "صوت ٠٠٢.m4a",
                speaker: "الشيخ فجر فروح"
            },
            {
                id: 3,
                title: "قيمة الانسان عند الله",
                mosque: "جامع سلمان الفارسي ",
                date: "2025-8-1",
                image: "photo_2025-08-01_15-14-59.jpg",
                audio: "صوت_٠٠٣_out.mp3",
                speaker: "الشيخ فجر فروح"
            },
            
        ];

        // عرض أحدث الخطب في الصفحة الرئيسية
        function displayLatestSermons() {
            const latestContainer = document.getElementById('latest-sermons');
            if (!latestContainer) return;

            // ترتيب الخطب من الأحدث إلى الأقدم
            const sortedSermons = [...sermons].sort((a, b) => new Date(b.date) - new Date(a.date));
            const latestSermons = sortedSermons.slice(0, 3); // عرض آخر 3 خطب

            latestSermons.forEach(sermon => {
                const sermonCard = document.createElement('div');
                sermonCard.className = 'sermon-card';

                sermonCard.innerHTML = `
                    <img src="${sermon.image}" alt="${sermon.title}" class="sermon-image">
                    <div class="sermon-info">
                        <h3 class="sermon-title">${sermon.title}</h3>
                        <div class="sermon-meta">
                            <p>${sermon.mosque} - ${sermon.city}</p>
                            <p>${formatDate(sermon.date)}</p>
                            <p>${sermon.speaker}</p>
                        </div>
                        <audio controls class="audio-player">
                            <source src="${sermon.audio}" type="audio/mpeg">
                            متصفحك لا يدعم تشغيل الصوتيات.
                        </audio>
                        <a href="${sermon.audio}" class="download-btn" download>تحميل الخطبة</a>
                    </div>
                `;

                latestContainer.appendChild(sermonCard);
            });
        }

        // تنسيق التاريخ
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('ar-EG', options);
        }

        // تهيئة الصفحة عند التحميل
        document.addEventListener('DOMContentLoaded', displayLatestSermons);
    </script>
</body>
</html>
