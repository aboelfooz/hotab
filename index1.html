<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطب الجمعة في مارع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 5px;
            position: relative;
        }

        .back-link {
            position: absolute;
            right: 20px;
            top: 20px;
            color: white;
            text-decoration: none;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.8rem;
            margin: 20px 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        .sermons-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .sermon-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .sermon-card:hover {
            transform: translateY(-5px);
        }

        .sermon-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .sermon-info {
            padding: 15px;
        }

        .sermon-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .sermon-meta {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .audio-player {
            width: 100%;
            margin-top: 10px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .download-btn:hover {
            background-color: #219653;
        }

        .filter-section {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        select, button {
            padding: 8px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 16px;
            background-color: white;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        @media (max-width: 768px) {
            .sermons-container {
                grid-template-columns: 1fr;
            }
            
            .filter-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>خطب الجمعة في مارع</h1>
            <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>
            <p style="color: #219653;">سيتم اضافة خطب الجمعة بالتدريج</p>
        </header>
        
        <div class="filter-section">
            <select id="mosque-filter">
                <option value="">كل الجوامع</option>
                <option value="جامع سلمان الفارسي ">  جامع سلمان الفارسي</option>
                <option value="جامع الفرقان">جامع  الفرقان </option>>
            </select>
            
            <select id="date-filter">
                <option value="">كل التواريخ</option>
                <option value="2023-7-11">11 يوليو 2023</option>
                
            </select>
            
            <button id="filter-btn">تصفية</button>
        </div>
        
        <div class="sermons-container" id="sermons-container">
            <!-- سيتم ملؤه بالجافا سكريبت -->
        </div>
    </div>

    <script>
        // بيانات الخطب الخاصة بدمشق
        const damascusSermons = [
            {
                id: 1,
                title: "الموت وانتهاء الاجل",
                mosque: "جامع سلمان الفارسي ",
                date: "2025-7-11",
                image: "sermon1.jpg",
                audio: "sermon1.mp3",
                speaker: "الشيخ فجر فروح"
            },
            
        ];

        // عرض الخطب
        function displaySermons(sermonsToDisplay = damascusSermons) {
            const container = document.getElementById('sermons-container');
            container.innerHTML = '';

            sermonsToDisplay.forEach(sermon => {
                const sermonCard = document.createElement('div');
                sermonCard.className = 'sermon-card';

                sermonCard.innerHTML = `
                    <img src="${sermon.image}" alt="${sermon.title}" class="sermon-image">
                    <div class="sermon-info">
                        <h3 class="sermon-title">${sermon.title}</h3>
                        <div class="sermon-meta">
                            <p>${sermon.mosque}</p>
                            <p>${formatDate(sermon.date)}</p>
                            <p>${sermon.speaker}</p>
                        </div>
                        <audio controls class="audio-player">
                            <source src="${sermon.audio}" type="audio/mpeg">
                            متصفحك لا يدعم تشغيل الصوتيات.
                        </audio>
                        <a href="${sermon.audio}" class="download-btn" download>تحميل الخطبة</a>
                    </div>
                `;

                container.appendChild(sermonCard);
            });
        }

        // تنسيق التاريخ
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('ar-EG', options);
        }

        // تصفية الخطب
        function filterSermons() {
            const mosque = document.getElementById('mosque-filter').value;
            const date = document.getElementById('date-filter').value;

            const filtered = damascusSermons.filter(sermon => {
                return (!mosque || sermon.mosque === mosque) &&
                       (!date || sermon.date === date);
            });

            displaySermons(filtered);
        }

        // تهيئة الصفحة عند التحميل
        document.addEventListener('DOMContentLoaded', () => {
            displaySermons();
            document.getElementById('filter-btn').addEventListener('click', filterSermons);
        });
    </script>
</body>
</html>
